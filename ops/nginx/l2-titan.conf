server {
    listen 80;
    server_name l2-titan.com www.l2-titan.com;
    return 301 https://l2-titan.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.l2-titan.com;
    return 301 https://l2-titan.com$request_uri;
}

# Después de cambios: sudo nginx -t && sudo systemctl reload nginx
# Si PSI sigue sin gzip/cache en HTML o /images/: (1) sites-enabled debe apuntar a este fichero;
# (2) comprobar: curl -sI -H 'Accept-Encoding: gzip' https://l2-titan.com/ | grep -i content-encoding
# (3) Cloudflare u otro proxy: no desactivar compresión ni sobrescribir Cache-Control hacia el origen.

server {
    listen 443 ssl http2;
    server_name l2-titan.com;

    root /var/www/l2-titan;
    index index.html;

    # SSL paths are deployment-specific. Replace with your real certificate files.
    ssl_certificate /etc/letsencrypt/live/l2-titan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/l2-titan.com/privkey.pem;

    # ── Cabeceras de seguridad (auditoría 2026-05-30) ──
    # OJO nginx: un `location` con su propio `add_header` NO hereda estos. Las locations
    # de assets (/_astro/, /images/, …) re-declaran Cache-Control, así que estas cabeceras
    # aplican sobre todo a las respuestas HTML (location /), que es donde más importan.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # CSP (auditada contra orígenes reales del site 2026-05-30):
    # script-src necesita 'unsafe-inline' por los is:inline de Astro + JSON-LD + FB pixel.
    # img-src https: cubre todos los badges de voto (hopzone, top100arena, l2top.info, l2network).
    # font-src cubre Google Fonts + fallback data: (íconos SVG inline).
    # frame-ancestors 'none' reemplaza X-Frame-Options con cobertura más amplia.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://l2-titan.com; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/html
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Canonical policy: no trailing slash on public URLs.
    location ~ ^(.+)/+$ {
        return 301 $scheme://$host$1;
    }

    # Slugs antiguos de noticias (301 HTTP; mejor que meta refresh 200 para Google).
    location = /news/valakas-past-event {
        return 301 https://l2-titan.com/news/valakas-26-abril-2026;
    }
    location = /news/valakas-past-event/ {
        return 301 https://l2-titan.com/news/valakas-26-abril-2026;
    }
    location = /news/baium-upcoming-event {
        return 301 https://l2-titan.com/news/baium-19-abril-2026;
    }
    location = /news/baium-upcoming-event/ {
        return 301 https://l2-titan.com/news/baium-19-abril-2026;
    }
    location = /news/castle-conquest-last-saturday {
        return 301 https://l2-titan.com/news/conquista-castillo-7-marzo-2026;
    }
    location = /news/castle-conquest-last-saturday/ {
        return 301 https://l2-titan.com/news/conquista-castillo-7-marzo-2026;
    }

    # Índice antiguo eliminado: misma intención que el centro /info.
    location = /guides {
        return 301 https://l2-titan.com/info;
    }
    location = /guides/ {
        return 301 https://l2-titan.com/info;
    }

    # Slugs en inglés → URLs canónicas (espejo de los redirects de astro.config.mjs; 301 HTTP en prod).
    location = /download { return 301 https://l2-titan.com/downloads; }
    location = /download/ { return 301 https://l2-titan.com/downloads; }
    location = /register { return 301 https://l2-titan.com/registro; }
    location = /register/ { return 301 https://l2-titan.com/registro; }
    location = /community { return 301 https://l2-titan.com/comunidad; }
    location = /community/ { return 301 https://l2-titan.com/comunidad; }
    location = /wiki { return 301 https://l2-titan.com/info; }
    location = /wiki/ { return 301 https://l2-titan.com/info; }

    # Evita 404 en crawlers que piden /favicon.ico (el sitio usa favicon.svg).
    location = /favicon.ico {
        alias /var/www/l2-titan/favicon.svg;
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Alias habitual: muchas herramientas piden /sitemap.xml
    location = /sitemap.xml {
        return 301 https://l2-titan.com/sitemap-index.xml;
    }

    location /_astro/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Imágenes estáticas: cache largo (PSI "efficient cache lifetimes").
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /sitemap-index.xml {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
